name: Validate mortgage website

on:
  pull_request:
    paths:
      - '**.html'
      - 'contents/**'
      - 'audit/**'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - '_worker.js'
      - 'sitemap.xml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'contents/**'
      - 'audit/**'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - '_worker.js'
      - 'sitemap.xml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  content-and-calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate financial models, observations and edge behavior
        run: node --test tests/*.test.cjs
      - name: Check articles, public pages, privacy tags and navigation
        run: |
          node scripts/validate_rates.js
          python scripts/validate_us_articles.py
          python scripts/validate_global_articles.py
          python scripts/validate_site_readiness.py
          python scripts/validate_publisher_release.py
      - name: Check reproducible website builds
        run: |
          python scripts/build_publisher_release.py
          git diff --exit-code

  browser-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned browser test runtime outside the publication tree
        run: |
          npm install --prefix "$RUNNER_TEMP/mpg-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/mpg-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/mpg-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify all calculator tools and primary pages with external requests blocked
        run: |
          node tests/publisher-tools-browser.cjs
          node tests/site-readiness-browser.cjs
          node tests/country-responsive-browser.cjs
