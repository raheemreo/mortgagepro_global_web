name: Sync Financial Rates Snapshot

on:
  schedule:
    # Run daily at 06:00 UTC and Thursdays at 20:00 UTC (post Freddie Mac release)
    - cron: '0 6 * * *'
    - cron: '0 20 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rate-snapshot-publication
  cancel-in-progress: false

jobs:
  sync-rates:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Rates Synchronization Script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          node scripts/fetch_live_rates.js
          python scripts/build_site_documents.py
          python scripts/publish_editorial_policy.py
          python scripts/apply_site_privacy.py
          node scripts/build_rate_assets.cjs
          node scripts/validate_rates.js
          python scripts/validate_site_readiness.py
          python scripts/validate_publisher_release.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json js/rate-snapshot.js sitemap.xml
          git add -u -- '*.html'
          if git diff --staged --quiet; then
            echo "No rate changes observed. Snapshot is up to date."
          else
            git commit -m "chore(rates): automated live financial rate snapshot update"
            git push origin main
          fi

      # GITHUB_TOKEN pushes do not start another Actions workflow. Verify here.
      - name: Confirm production rate publication
        run: node scripts/verify_rate_publication.cjs
